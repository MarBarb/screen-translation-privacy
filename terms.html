    :root {

      --secondary: #5f6b7d;
      --border: rgba(22, 32, 51, 0.1);
      --shadow: 0 22px 64px rgba(25, 72, 145, 0.12);

      :root {
        --page: #07111f;
        --card: rgba(15, 29, 48, 0.9);
        --text: #f2f6ff;
        --secondary: #a8b4c6;
        --border: rgba(255, 255, 255, 0.11);
        --shadow: 0 24px 68px rgba(0, 0, 0, 0.34);
      }
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      min-height: 100vh;
      background:
        radial-gradient(circle at 20% 0%, rgba(20, 118, 237, 0.14), transparent 36rem),
        var(--page);
      color: var(--text);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      line-height: 1.68;
    }

    main {
      width: min(792px, 100%);
      margin: 0 auto;
      padding: 48px 16px 64px;
    }

    .topbar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 18px;
      margin-bottom: 24px;
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 12px;
      font-weight: 700;
    }

    .mark {
      display: block;
      width: 36px;
      height: 36px;
      border-radius: 9px;
      box-shadow: 0 7px 18px rgba(20, 86, 190, 0.22);
    }

    select {
      width: min(170px, 44vw);
      padding: 9px 30px 9px 12px;
      border: 1px solid var(--border);
      border-radius: 12px;
      background: var(--card);
      color: var(--text);
      font: inherit;
    }

    article {
      padding: clamp(26px, 5vw, 52px);
      border: 1px solid var(--border);
      border-radius: 28px;
      background: var(--card);
      box-shadow: var(--shadow);
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
    }

    h1 {
      margin: 0 0 4px;
      font-size: clamp(30px, 6vw, 46px);
      line-height: 1.15;
      letter-spacing: -0.035em;
    }

    .updated {
      margin: 0 0 30px;
      color: var(--secondary);
      font-size: 14px;
    }

    .intro {
      margin: 0 0 34px;
      font-size: 17px;
    }

    section + section { margin-top: 28px; }

    h2 {
      margin: 0 0 7px;
      font-size: 19px;
      letter-spacing: -0.01em;
    }

    p { margin: 0; }
    section p { color: var(--secondary); }

    footer {
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      gap: 18px;
      margin-top: 24px;
      color: var(--secondary);
      font-size: 13px;
    }

    a { color: var(--accent); }

    @media (max-width: 520px) {
      main { padding: 24px 12px 48px; }
      .brand span:last-child { display: none; }
      article { border-radius: 22px; }
    }
  </style>

    const supported = Object.keys(terms);
    const select = document.getElementById("language");

    function preferredLanguage() {
      for (const language of navigator.languages || [navigator.language]) {
        const normalized = language.toLowerCase();
        if (normalized.startsWith("zh-hant") || normalized.includes("tw") || normalized.includes("hk")) return "zh-Hant";
        if (normalized.startsWith("zh")) return "zh-Hans";
        const base = normalized.split("-")[0];
        if (supported.includes(base)) return base;
      }
      return "en";
    }

    function render(language) {
      const documentTerms = terms[language] || terms.en;
      document.documentElement.lang = language;
      document.title = documentTerms.appName + " · " + documentTerms.title;
      document.getElementById("app-name").textContent = documentTerms.appName;
      document.getElementById("title").textContent = documentTerms.title;
      document.getElementById("updated").textContent = documentTerms.updated;
      document.getElementById("intro").textContent = documentTerms.intro;
      document.getElementById("privacy").textContent = documentTerms.privacy;
      document.getElementById("sections").replaceChildren(...documentTerms.sections.map(([title, body]) => {
        const section = document.createElement("section");
        const heading = document.createElement("h2");
        const paragraph = document.createElement("p");
        heading.textContent = title;
        paragraph.textContent = body;
        section.append(heading, paragraph);
        return section;
      }));
      select.value = language;
    }

    select.addEventListener("change", event => render(event.target.value));
    render(preferredLanguage());
  </script>
