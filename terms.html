<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="light dark">
  <meta name="description" content="Live Translate · Terms of Use">
  <title>Live Translate · Terms of Use</title>
  <style>
    :root {
      color-scheme: light dark;
      --accent: #1476ed;
      --page: #f5f7fb;
      --card: rgba(255, 255, 255, 0.88);
      --text: #162033;
      --secondary: #5f6b7d;
      --border: rgba(22, 32, 51, 0.1);
      --shadow: 0 22px 64px rgba(25, 72, 145, 0.12);
    }

    @media (prefers-color-scheme: dark) {
      :root {
        --page: #07111f;
        --card: rgba(15, 29, 48, 0.9);
        --text: #f2f6ff;
        --secondary: #a8b4c6;
        --border: rgba(255, 255, 255, 0.11);
        --shadow: 0 24px 68px rgba(0, 0, 0, 0.34);
      }
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      min-height: 100vh;
      background:
        radial-gradient(circle at 20% 0%, rgba(20, 118, 237, 0.14), transparent 36rem),
        var(--page);
      color: var(--text);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      line-height: 1.68;
    }

    main {
      width: min(792px, 100%);
      margin: 0 auto;
      padding: 48px 16px 64px;
    }

    .topbar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 18px;
      margin-bottom: 24px;
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 12px;
      font-weight: 700;
    }

    .mark {
      display: block;
      width: 36px;
      height: 36px;
      border-radius: 9px;
      box-shadow: 0 7px 18px rgba(20, 86, 190, 0.22);
    }

    .language-switcher {
      position: relative;
      display: flex;
      align-items: center;
      gap: 8px;
      min-width: 148px;
      height: 42px;
      padding: 0 12px;
      border: 1px solid var(--border);
      border-radius: 14px;
      background: color-mix(in srgb, var(--card) 88%, transparent);
      box-shadow:
        0 8px 24px rgba(25, 72, 145, 0.08),
        inset 0 1px 0 rgba(255, 255, 255, 0.18);
      backdrop-filter: blur(18px);
      -webkit-backdrop-filter: blur(18px);
      transition: border-color 160ms ease, transform 160ms ease, box-shadow 160ms ease;
    }

    .language-switcher:hover {
      border-color: color-mix(in srgb, var(--accent) 34%, var(--border));
      box-shadow:
        0 10px 28px rgba(25, 72, 145, 0.13),
        inset 0 1px 0 rgba(255, 255, 255, 0.2);
    }

    .language-switcher:active { transform: scale(0.98); }

    .language-switcher:focus-within {
      border-color: var(--accent);
      box-shadow: 0 0 0 3px rgba(20, 118, 237, 0.16);
    }

    .language-switcher svg {
      flex: 0 0 auto;
      color: var(--accent);
    }

    .language-switcher select {
      min-width: 0;
      width: 100%;
      padding: 0 20px 0 0;
      border: 0;
      outline: 0;
      appearance: none;
      -webkit-appearance: none;
      background: transparent;
      color: var(--text);
      font: 600 14px/1.2 -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      cursor: pointer;
    }

    .language-switcher .chevron {
      position: absolute;
      right: 11px;
      pointer-events: none;
      color: var(--secondary);
    }

    article {
      padding: clamp(26px, 5vw, 52px);
      border: 1px solid var(--border);
      border-radius: 28px;
      background: var(--card);
      box-shadow: var(--shadow);
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
    }

    h1 {
      margin: 0 0 4px;
      font-size: clamp(30px, 6vw, 46px);
      line-height: 1.15;
      letter-spacing: -0.035em;
    }

    .updated {
      margin: 0 0 30px;
      color: var(--secondary);
      font-size: 14px;
    }

    .intro {
      margin: 0 0 34px;
      font-size: 17px;
    }

    section + section { margin-top: 28px; }

    h2 {
      margin: 0 0 7px;
      font-size: 19px;
      letter-spacing: -0.01em;
    }

    p { margin: 0; }
    section p { color: var(--secondary); }

    footer {
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      gap: 18px;
      margin-top: 24px;
      color: var(--secondary);
      font-size: 13px;
    }

    a { color: var(--accent); }

    @media (max-width: 520px) {
      main { padding: 24px 12px 48px; }
      .brand span:last-child { display: none; }
      article { border-radius: 22px; }
    }

    section p { white-space: pre-line; overflow-wrap: anywhere; }
    h1, h2 { overflow-wrap: anywhere; hyphens: auto; }
    :is([lang="ar"], [lang="hi"], [lang="th"]) :is(h1, h2) { letter-spacing: normal; line-height: 1.4; }
    .brand { min-width: 0; }
    .language-switcher { flex-shrink: 0; }
    .language-switcher select { padding-inline: 0 20px; }
    .language-switcher .chevron { right: auto; inset-inline-end: 12px; }
    [dir="rtl"] .language-switcher select { padding-inline: 0 20px; }
    @media (max-width: 360px) { .topbar { gap: 8px; } .language-switcher { min-width: 0; width: 190px; } }
  </style>
</head>

        </svg>
        <select id="language" aria-labelledby="language-label">

        </select>

          <path d="m3 4.5 3 3 3-3" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"/>
        </svg>
      </label>
    </div>

    <article>
      <h1 id="title"></h1>
      <p class="updated" id="updated"></p>
      <p class="intro" id="intro"></p>
      <div id="sections"></div>
    </article>

      const tag = value.replaceAll("_", "-");
      const lower = tag.toLowerCase();
      if (/^zh(?:-|$)/.test(lower)) return /(?:^|[-])(hant|tw|hk|mo)(?:[-]|$)/.test(lower) ? "zh-Hant" : "zh-Hans";
      const base = lower.split("-")[0];
      return supported.includes(base) ? base : null;
    }
    function storedLanguage() {
      try { return localStorage.getItem("site-language"); } catch { return null; }
    }
    function render(language) {
      language = matchLanguage(language) || "en";
      const content = terms[language];
      document.documentElement.lang = language;
      document.documentElement.dir = language === "ar" ? "rtl" : "ltr";
      document.title = content.appName + " · " + content.title;
      document.querySelector('meta[name="description"]').content = content.appName + " · " + content.title;
      for (const id of ["app-name", "title", "updated", "intro", "support"]) {
        document.getElementById(id).textContent = content[id === "app-name" ? "appName" : id];
      }
      const other = document.getElementById("privacy");
      other.textContent = content.privacy;
      other.href = "./index.html?lang=" + encodeURIComponent(language);
      document.getElementById("sections").replaceChildren(...content.sections.map(([title, body]) => {
        const section = document.createElement("section");
        const heading = document.createElement("h2");
        const paragraph = document.createElement("p");
        heading.textContent = title; paragraph.textContent = body;
        section.append(heading, paragraph); return section;
      }));
      document.querySelectorAll('a[href^="mailto:"]').forEach(link => { link.dir = "ltr"; });
      select.value = language;
    }
    select.addEventListener("change", event => {
      try { localStorage.setItem("site-language", event.target.value); } catch {}
      const url = new URL(location.href);
      url.searchParams.set("lang", event.target.value);
      history.replaceState(null, "", url);
      render(event.target.value);
    });
    const queryLanguage = matchLanguage(new URLSearchParams(location.search).get("lang"));
    const savedLanguage = matchLanguage(storedLanguage());
    const browserLanguages = navigator.languages || [navigator.language];
    render(queryLanguage || savedLanguage || browserLanguages.map(matchLanguage).find(Boolean) || "en");
  </script>
</body>
</html>
