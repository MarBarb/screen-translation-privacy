<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="light dark">
  <meta name="description" content="Live Translation Support">
  <title>Live Translation · Support</title>
  <style>
    :root {
      color-scheme: light dark;
      --accent: #1476ed;
      --page: #f5f7fb;
      --card: rgba(255, 255, 255, 0.88);
      --text: #162033;
      --secondary: #5f6b7d;
      --border: rgba(22, 32, 51, 0.1);
      --shadow: 0 22px 64px rgba(25, 72, 145, 0.12);
    }

    @media (prefers-color-scheme: dark) {
      :root {
        --page: #07111f;
        --card: rgba(15, 29, 48, 0.9);
        --text: #f2f6ff;
        --secondary: #a8b4c6;
        --border: rgba(255, 255, 255, 0.11);
        --shadow: 0 24px 68px rgba(0, 0, 0, 0.34);
      }
    }

    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      background:
        radial-gradient(circle at 20% 0%, rgba(20, 118, 237, 0.14), transparent 36rem),
        var(--page);
      color: var(--text);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      line-height: 1.68;
    }
    main { width: min(792px, 100%); margin: 0 auto; padding: 48px 16px 64px; }
    .topbar { display: flex; align-items: center; justify-content: space-between; gap: 18px; margin-bottom: 24px; }
    .brand { display: flex; align-items: center; gap: 12px; font-weight: 700; }
    .mark { display: block; width: 36px; height: 36px; border-radius: 9px; box-shadow: 0 7px 18px rgba(20, 86, 190, 0.22); }
    .language-switcher {
      position: relative; display: flex; align-items: center; gap: 8px; min-width: 148px; height: 42px;
      padding: 0 12px; border: 1px solid var(--border); border-radius: 14px;
      background: color-mix(in srgb, var(--card) 88%, transparent); box-shadow: 0 8px 24px rgba(25, 72, 145, 0.08);
      backdrop-filter: blur(18px); -webkit-backdrop-filter: blur(18px);
    }
    .language-switcher select {
      width: 100%; padding: 0 20px 0 0; border: 0; outline: 0; appearance: none; -webkit-appearance: none;
      background: transparent; color: var(--text); font: 600 14px/1.2 -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }
    .language-switcher svg { flex: 0 0 auto; color: var(--accent); }
    .language-switcher .chevron { position: absolute; right: 11px; pointer-events: none; color: var(--secondary); }
    article {
      padding: clamp(26px, 5vw, 52px); border: 1px solid var(--border); border-radius: 28px;
      background: var(--card); box-shadow: var(--shadow); backdrop-filter: blur(20px); -webkit-backdrop-filter: blur(20px);
    }
    h1 { margin: 0 0 10px; font-size: clamp(30px, 6vw, 46px); line-height: 1.15; letter-spacing: -0.035em; }
    .intro { margin: 0 0 34px; color: var(--secondary); font-size: 17px; }
    section + section { margin-top: 28px; }
    h2 { margin: 0 0 7px; font-size: 19px; }
    p { margin: 0; color: var(--secondary); }
    .contact {
      display: inline-flex; align-items: center; gap: 9px; margin-top: 28px; padding: 12px 16px;
      border-radius: 14px; background: var(--accent); color: white; text-decoration: none; font-weight: 700;
    }
    footer { display: flex; flex-wrap: wrap; justify-content: center; gap: 18px; margin-top: 24px; color: var(--secondary); font-size: 13px; }
    footer a { color: var(--accent); }
    @media (max-width: 520px) {
      main { padding: 24px 12px 48px; }
      .brand span:last-child { display: none; }
      article { border-radius: 22px; }
    }
  </style>
</head>
<body>
  <main>
    <div class="topbar">
      <div class="brand">
        <img class="mark" src="./app-icon.png" width="36" height="36" alt="">
        <span id="app-name">Live Translation</span>
      </div>
      <label class="language-switcher">
        <span id="language-label" hidden>Language</span>
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" aria-hidden="true">
          <circle cx="12" cy="12" r="9" stroke="currentColor" stroke-width="1.8"/>
          <path d="M3.6 9h16.8M3.6 15h16.8M12 3c2.2 2.5 3.3 5.5 3.3 9S14.2 18.5 12 21M12 3C9.8 5.5 8.7 8.5 8.7 12s1.1 6.5 3.3 9" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/>
        </svg>
        <select id="language" aria-labelledby="language-label">
          <option value="en">English</option>
          <option value="zh-Hans">简体中文</option>
          <option value="zh-Hant">繁體中文</option>
          <option value="ja">日本語</option>
          <option value="ko">한국어</option>
          <option value="fr">Français</option>
          <option value="de">Deutsch</option>
          <option value="es">Español</option>
        </select>
        <svg class="chevron" width="12" height="12" viewBox="0 0 12 12" fill="none" aria-hidden="true">
          <path d="m3 4.5 3 3 3-3" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"/>
        </svg>
      </label>
    </div>

    <article>
      <h1 id="title"></h1>
      <p class="intro" id="intro"></p>
      <div id="sections"></div>
      <a class="contact" id="contact" href="mailto:lch0810@outlook.com"></a>
    </article>

    <footer>
      <span>© Chenghuang Li</span>
      <a href="./" id="privacy"></a>
      <a href="./terms.html" id="terms"></a>
    </footer>
  </main>

    const supported = Object.keys(content);
    const select = document.getElementById("language");
    function render(language) {
      const page = content[language] || content.en;
      document.documentElement.lang = language;
      document.title = `${page.appName} · ${page.title}`;
      document.getElementById("app-name").textContent = page.appName;
      document.getElementById("title").textContent = page.title;
      document.getElementById("intro").textContent = page.intro;
      document.getElementById("privacy").textContent = page.privacy;
      document.getElementById("terms").textContent = page.terms;
      document.getElementById("contact").textContent = page.contact;
      document.getElementById("sections").replaceChildren(...page.sections.map(([title, body]) => {
        const section = document.createElement("section");
        const heading = document.createElement("h2");
        const paragraph = document.createElement("p");
        heading.textContent = title;
        paragraph.textContent = body;
        section.append(heading, paragraph);
        return section;
      }));
      select.value = language;
    }
    select.addEventListener("change", event => {
      localStorage.setItem("site-language", event.target.value);
      render(event.target.value);
    });
    const saved = localStorage.getItem("site-language");
    render(supported.includes(saved) ? saved : "en");
  </script>
</body>
</html>
