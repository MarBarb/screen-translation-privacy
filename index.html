  <style>
    :root {
      color-scheme: light dark;
      --accent: #1476ed;
      --page: #f5f7fb;
      --card: rgba(255, 255, 255, 0.88);
      --text: #162033;
      --secondary: #5f6b7d;
      --border: rgba(22, 32, 51, 0.1);
      --shadow: 0 22px 64px rgba(25, 72, 145, 0.12);
    }

    @media (prefers-color-scheme: dark) {
      :root {
        --page: #07111f;
        --card: rgba(15, 29, 48, 0.9);
        --text: #f2f6ff;
        --secondary: #a8b4c6;
        --border: rgba(255, 255, 255, 0.11);
        --shadow: 0 24px 68px rgba(0, 0, 0, 0.34);
      }
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      min-height: 100vh;
      background:
        radial-gradient(circle at 20% 0%, rgba(20, 118, 237, 0.14), transparent 36rem),
        var(--page);
      color: var(--text);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      line-height: 1.68;
    }

    main {
      width: min(792px, 100%);
      margin: 0 auto;
      padding: 48px 16px 64px;
    }

    .topbar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 18px;
      margin-bottom: 24px;
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 12px;
      font-weight: 700;
    }

    .mark {
      display: block;
      width: 36px;
      height: 36px;
      border-radius: 9px;
      box-shadow: 0 7px 18px rgba(20, 86, 190, 0.22);
    }

    .language-switcher {
      position: relative;
      display: flex;
      align-items: center;
      gap: 8px;
      min-width: 148px;
      height: 42px;
      padding: 0 12px;
      border: 1px solid var(--border);
      border-radius: 14px;
      background: color-mix(in srgb, var(--card) 88%, transparent);
      box-shadow:
        0 8px 24px rgba(25, 72, 145, 0.08),
        inset 0 1px 0 rgba(255, 255, 255, 0.18);
      backdrop-filter: blur(18px);
      -webkit-backdrop-filter: blur(18px);
      transition: border-color 160ms ease, transform 160ms ease, box-shadow 160ms ease;
    }

    .language-switcher:hover {
      border-color: color-mix(in srgb, var(--accent) 34%, var(--border));
      box-shadow:
        0 10px 28px rgba(25, 72, 145, 0.13),
        inset 0 1px 0 rgba(255, 255, 255, 0.2);
    }

    .language-switcher:active { transform: scale(0.98); }

    .language-switcher:focus-within {
      border-color: var(--accent);
      box-shadow: 0 0 0 3px rgba(20, 118, 237, 0.16);
    }

    .language-switcher svg {
      flex: 0 0 auto;
      color: var(--accent);
    }

    .language-switcher select {
      min-width: 0;
      width: 100%;
      padding: 0 20px 0 0;
      border: 0;
      outline: 0;
      appearance: none;
      -webkit-appearance: none;
      background: transparent;
      color: var(--text);
      font: 600 14px/1.2 -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      cursor: pointer;
    }

    .language-switcher .chevron {
      position: absolute;
      right: 11px;
      pointer-events: none;
      color: var(--secondary);
    }

    article {
      padding: clamp(26px, 5vw, 52px);
      border: 1px solid var(--border);
      border-radius: 28px;
      background: var(--card);
      box-shadow: var(--shadow);
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
    }

    h1 {
      margin: 0 0 4px;
      font-size: clamp(30px, 6vw, 46px);
      line-height: 1.15;
      letter-spacing: -0.035em;
    }

    .updated {
      margin: 0 0 30px;
      color: var(--secondary);
      font-size: 14px;
    }

    .intro {
      margin: 0 0 34px;
      font-size: 17px;
    }

    section + section { margin-top: 28px; }

    h2 {
      margin: 0 0 7px;
      font-size: 19px;
      letter-spacing: -0.01em;
    }

    p { margin: 0; }

    section p { color: var(--secondary); }

    footer {
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      gap: 18px;
      margin-top: 24px;
      color: var(--secondary);
      font-size: 13px;
    }

    footer a { color: var(--accent); }

    @media (max-width: 520px) {
      main { padding: 24px 12px 48px; }
      .brand span:last-child { display: none; }
      article { border-radius: 22px; }
    }

</head>

        appName: "Traducción en vivo", title: "Política de privacidad", updated: "Actualizado: 10 de agosto de 2026",
        intro: "Traducción en vivo realiza el procesamiento en el dispositivo siempre que es posible y limita el tratamiento de datos al mínimo necesario para sus funciones principales.",
        terms: "Términos de uso", support: "Soporte",
        sections: [
          ["Audio y subtítulos", "El audio del sistema, los resultados de transcripción y las traducciones se procesan en el dispositivo mediante ReplayKit y los frameworks de reconocimiento de voz y traducción de Apple. La app no sube este contenido a los servidores del desarrollador."],
          ["Compras", "Las compras y suscripciones se procesan mediante Apple App Store. La app solo lee productos y derechos verificados por StoreKit y no recibe la información de pago completa."],
          ["Datos locales", "Los idiomas, las preferencias de subtítulos, el tiempo de uso gratuito y el estado de ejecución se guardan localmente en el dispositivo o en el contenedor del App Group para restaurar ajustes y coordinar la app con su extensión de retransmisión."],
          ["Solicitudes de recompensa", "Cuando eliges enviar una solicitud de recompensa y confirmas el correo, el desarrollador recibe tu dirección de remitente, tu ID o nombre de usuario de la plataforma social, el enlace al contenido público y las capturas de perfil, Me gusta y visualizaciones que adjuntes voluntariamente. Estos datos se usan únicamente para verificar la solicitud, prevenir solicitudes fraudulentas, entregar la recompensa y contactar contigo. No se usan para rastreo ni se venden a terceros. La solicitud es totalmente opcional y no afecta a las funciones principales de la app."],
          ["Seguimiento y uso compartido", "La app no integra SDK de terceros para publicidad, seguimiento o análisis y no vende información personal a terceros."],
          ["Tus controles", "Puedes detener la retransmisión del sistema, revocar el permiso de reconocimiento de voz o eliminar la app para borrar sus datos locales en cualquier momento."],
          ["Contacto", "Si tienes preguntas sobre esta política, escribe a lch0810@outlook.com."]
        ]
      }
    };

    const supported = Object.keys(policies);
    const select = document.getElementById("language");

    function render(language) {
      const policy = policies[language] || policies.en;
      document.documentElement.lang = language;
      document.title = `${policy.appName} · ${policy.title}`;
      document.getElementById("app-name").textContent = policy.appName;
      document.getElementById("title").textContent = policy.title;
      document.getElementById("updated").textContent = policy.updated;
      document.getElementById("intro").textContent = policy.intro;
      document.getElementById("terms").textContent = policy.terms;
      document.getElementById("support").textContent = policy.support;
      document.getElementById("sections").replaceChildren(...policy.sections.map(([title, body]) => {
        const section = document.createElement("section");
        const heading = document.createElement("h2");
        const paragraph = document.createElement("p");
        heading.textContent = title;
        paragraph.textContent = body;
        section.append(heading, paragraph);
        return section;
      }));
      select.value = language;
    }

    select.addEventListener("change", event => {
      localStorage.setItem("site-language", event.target.value);
      render(event.target.value);
    });
    const saved = localStorage.getItem("site-language");
    render(supported.includes(saved) ? saved : "en");
  </script>
</body>
</html>
